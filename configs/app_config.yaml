app:
  name: "Sports AI Analytics Platform"
  version: "1.0.0"
  env: "development"

device:
  use_cuda: false
  device_id: 0
  precision: "fp32"

backend:
  host: "0.0.0.0"
  port: 8000
  workers: 4

upload:
  max_file_size_mb: 500
  allowed_extensions: [".mp4", ".avi", ".mov", ".mkv", ".webm"]
  upload_dir: "data/raw"
  output_dir: "data/outputs"
