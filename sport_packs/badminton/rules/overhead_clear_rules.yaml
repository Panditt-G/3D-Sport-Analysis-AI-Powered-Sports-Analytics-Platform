rules:
  - id: "bent_elbow_at_contact"
    title: "Insufficient Arm Extension at Contact"
    metric: "contact_elbow_angle"
    phase: "contact"
    condition: "value < 162.0"
    severity: "high"
    category: "technique"
    observed_difference_template: "Elbow was bent at {observed_val:.1f} deg at impact (reference target: 165 - 180 deg)."
    suggested_correction: "Reach up to meet the shuttlecock at the peak of your extension. Avoid letting the shuttle drop below head height before initiating contact."
    efficiency_impact: "Power leakage: Hitting with a bent elbow shortens your kinetic lever arm, reducing shuttle exit speed and trajectory depth."
    injury_caution: "Repetitive overhead hitting with excessive elbow flexion forces the triceps and medial elbow tendons to absorb high eccentric stress, a known contributing factor to medial epicondyle discomfort (Golfer's/Badminton elbow)."
    evidence_level: "High (BWF Coaching Guidelines & Biomechanics Literature)"
    min_confidence: 0.65

  - id: "dropped_elbow_backswing"
    title: "Dropped Elbow During Backswing Preparation"
    metric: "backswing_elbow_angle"
    phase: "backswing"
    condition: "value > 105.0"
    severity: "medium"
    category: "technique"
    observed_difference_template: "Elbow was low and extended ({observed_val:.1f} deg) during backswing cocking (reference target: 65 - 95 deg)."
    suggested_correction: "Raise your hitting elbow above shoulder level behind your head, creating a compact coiled racket drop."
    efficiency_impact: "Delayed kinetic loading: Low elbow prevents full pectoral and shoulder stretch-shortening cycle, weakening stroke whip."
    injury_caution: "Swinging from a dropped elbow increases anterior shoulder joint strain and internal impingement risk during high-speed rotation."
    evidence_level: "Medium (Sports Biomechanics Review)"
    min_confidence: 0.60

  - id: "low_contact_point"
    title: "Low Shoulder Elevation at Contact"
    metric: "contact_shoulder_elevation"
    phase: "contact"
    condition: "value < 150.0"
    severity: "high"
    category: "technique"
    observed_difference_template: "Shoulder elevation was only {observed_val:.1f} deg at contact (reference: 155 - 178 deg)."
    suggested_correction: "Elevate your hitting shoulder and rotate your upper torso upward. Contact the shuttle higher in front of your body."
    efficiency_impact: "Flatter trajectory: Contacting low transforms a clear into a vulnerable mid-court drive or flat lift."
    injury_caution: "Excessive downward angle forces compensating lumbar spine hyperextension."
    evidence_level: "High (National Coaching Manual)"
    min_confidence: 0.65

  - id: "excessive_backward_lean"
    title: "Excessive Backward Spine Arch at Impact"
    metric: "trunk_forward_tilt"
    phase: "contact"
    condition: "value < 2.0"
    severity: "medium"
    category: "technique"
    observed_difference_template: "Body was tilted backward ({observed_val:.1f} deg) at contact (reference: 5 - 18 deg forward)."
    suggested_correction: "Move your feet behind the shuttlecock earlier so you hit while transferring your weight forward, finishing with the non-racket leg stepping through."
    efficiency_impact: "Loss of recovery momentum: Backward momentum slows your recovery push back to the center base."
    injury_caution: "Repeated hyperextension of the lumbar spine during overhead impact places repetitive compressive loads on the posterior facet joints."
    evidence_level: "Medium (Clinical Biomechanics in Racket Sports)"
    min_confidence: 0.60
